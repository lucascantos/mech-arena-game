<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mech Arena</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1116; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
      .menu {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 16px; background: #0e1116ee; color: #c9d1d9; font-family: system-ui, sans-serif;
      }
      .menu[hidden] { display: none; }
      .menu h1 { margin: 0 0 18px; font-size: clamp(32px, 7vw, 56px); letter-spacing: 0.12em; color: #e6edf3; }
      .menu button {
        width: min(360px, 100%); padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
        background: #161b22; color: #e6edf3; border: 2px solid #3a4452; border-radius: 6px; cursor: pointer; text-align: left;
      }
      .menu button:hover, .menu button:focus-visible { border-color: #58a6ff; outline: none; background: #1c2330; }
      .menu-title { font-size: 20px; font-weight: 700; }
      .menu-detail { font-size: 13px; color: #8b949e; }
      .menu-hint { margin: 10px 0 0; font-size: 12px; color: #8b949e; }
      .menu-status { min-height: 1.2em; margin: 4px 0 0; font-size: 13px; color: #d29922; text-align: center; max-width: 360px; }
      .menu-code { font: 700 44px ui-monospace, Consolas, monospace; letter-spacing: 0.25em; color: #58a6ff; user-select: all; }
      .menu-input {
        width: min(360px, 100%); box-sizing: border-box; padding: 12px; text-align: center; text-transform: uppercase;
        font: 700 28px ui-monospace, Consolas, monospace; letter-spacing: 0.25em;
        background: #0e1116; color: #e6edf3; border: 2px solid #3a4452; border-radius: 6px;
      }
      .menu-input:focus { outline: none; border-color: #58a6ff; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
