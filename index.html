<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mech Arena</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1116; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
      .menu {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 16px; background: #0e1116ee; color: #c9d1d9; font-family: system-ui, sans-serif;
      }
      .menu[hidden] { display: none; }
      .menu h1 { margin: 0 0 18px; font-size: clamp(32px, 7vw, 56px); letter-spacing: 0.12em; color: #e6edf3; }
      .menu button {
        width: min(360px, 100%); padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
        background: #161b22; color: #e6edf3; border: 2px solid #3a4452; border-radius: 6px; cursor: pointer; text-align: left;
      }
      .menu button:hover, .menu button:focus-visible { border-color: #58a6ff; outline: none; background: #1c2330; }
      .menu-title { font-size: 20px; font-weight: 700; }
      .menu-detail { font-size: 13px; color: #8b949e; }
      .menu-hint { margin: 10px 0 0; font-size: 12px; color: #8b949e; }
      .menu-status { min-height: 1.2em; margin: 4px 0 0; font-size: 13px; color: #d29922; text-align: center; max-width: 360px; }
      .menu-code { font: 700 44px ui-monospace, Consolas, monospace; letter-spacing: 0.25em; color: #58a6ff; user-select: all; }
      .menu-input {
        width: min(360px, 100%); box-sizing: border-box; padding: 12px; text-align: center; text-transform: uppercase;
        font: 700 28px ui-monospace, Consolas, monospace; letter-spacing: 0.25em;
        background: #0e1116; color: #e6edf3; border: 2px solid #3a4452; border-radius: 6px;
      }
      .menu-input:focus { outline: none; border-color: #58a6ff; }
      .menu.wide { justify-content: flex-start; }
      .hangar {
        flex: 1; min-height: 0; width: min(1240px, 100%); display: grid; gap: 14px;
        grid-template-columns: minmax(200px, 0.8fr) minmax(280px, 1.2fr) minmax(300px, 1.3fr);
      }
      .hangar section {
        display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto;
        padding: 12px; background: #11161d; border: 1px solid #262e38; border-radius: 8px;
      }
      .hangar-heading { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #8b949e; }
      .menu .hangar button { width: 100%; padding: 10px 12px; flex-shrink: 0; }
      .menu .hangar .hangar-slot { flex-direction: row; justify-content: space-between; align-items: center; }
      .menu .hangar .hangar-slot.active { border-color: #58a6ff; background: #1c2330; }
      .hangar-slot-label { font-weight: 700; }
      .hangar-slot-value { font-size: 13px; color: #8b949e; }
      .menu .hangar .hangar-done { margin-top: auto; align-items: center; font-weight: 700; font-size: 16px; }
      .menu .hangar .hangar-option.equipped { border-color: #3fb950; }
      .hangar-option-name { font-weight: 700; font-size: 15px; }
      .hangar-tag { font-size: 12px; color: #3fb950; }
      .hangar-delta { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; width: 100%; font: 12px ui-monospace, Consolas, monospace; }
      .hangar-delta-label, .hangar-delta-from { color: #8b949e; }
      .hangar .up { color: #3fb950; font-weight: 700; }
      .hangar .down { color: #f85149; font-weight: 700; }
      .hangar .same { color: #c9d1d9; }
      .hangar-name {
        padding: 8px 10px; font: 700 18px system-ui, sans-serif; background: #0e1116; color: #e6edf3;
        border: 2px solid #3a4452; border-radius: 6px;
      }
      .hangar-name:focus { outline: none; border-color: #58a6ff; }
      .hangar-attrs { display: grid; grid-template-columns: max-content minmax(60px, 1fr) max-content; align-items: center; gap: 9px 12px; font-size: 13px; }
      .hangar-attr { display: contents; }
      .hangar-attr-label { color: #c9d1d9; }
      .hangar-attr-value { text-align: right; font: 12px ui-monospace, Consolas, monospace; color: #e6edf3; }
      .hangar-bar { height: 8px; background: #0e1116; border: 1px solid #262e38; border-radius: 4px; overflow: hidden; }
      .hangar-bar > div { height: 100%; background: #58a6ff; }
      @media (max-width: 820px) {
        .menu.wide { overflow-y: auto; }
        .hangar { flex: none; grid-template-columns: 1fr; }
        .hangar section { overflow: visible; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
